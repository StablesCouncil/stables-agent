<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background gradient matching brand spec -->
    <radialGradient id="bgGradient" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:rgba(103, 232, 249, 0.18);stop-opacity:1" />
      <stop offset="55%" style="stop-color:rgba(103, 232, 249, 0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0f14;stop-opacity:1" />
    </radialGradient>
    
    <!-- Glassmorphism filter -->
    <filter id="glass" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Cyan glow -->
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#67e8f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#0b0f14" rx="16"/>
  <rect width="400" height="200" fill="url(#bgGradient)" rx="16"/>
  
  <!-- Glassmorphic card background -->
  <rect x="20" y="20" width="360" height="160" rx="24" 
        fill="rgba(15, 23, 42, 0.6)" 
        filter="url(#glass)"
        stroke="rgba(103, 232, 249, 0.3)" 
        stroke-width="1"/>
  
  <!-- Stables Logo Symbol (embedded from logo-symbol.png) -->
  <image href="logo-symbol.png" x="30" y="50" width="80" height="80" preserveAspectRatio="xMidYMid meet" filter="url(#cyanGlow)"/>
  
  <!-- "Pay in" text on top -->
  <text x="200" y="65" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" 
        fill="#9fb0c0" text-anchor="start">Pay in</text>
  
  <!-- "STABLES" name (matching presentation style) -->
  <text x="200" y="110" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="900" 
        fill="url(#textGradient)" text-anchor="start" letter-spacing="-0.02em">STABLES</text>
  
  <!-- "Here" text underneath -->
  <text x="200" y="140" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" 
        fill="#67e8f9" text-anchor="start">Here</text>
  
  <!-- "made possible by Minima" at bottom -->
  <text x="200" y="165" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" 
        fill="#9fb0c0" text-anchor="start" opacity="0.8">made possible by Minima</text>
  
  <!-- Cyan accent line -->
  <line x1="200" y1="75" x2="370" y2="75" stroke="#67e8f9" stroke-width="1.5" opacity="0.4"/>
</svg>
