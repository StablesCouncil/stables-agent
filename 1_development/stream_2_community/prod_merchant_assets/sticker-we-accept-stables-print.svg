<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background gradient matching brand spec -->
    <radialGradient id="bgGradient" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:rgba(103, 232, 249, 0.18);stop-opacity:1" />
      <stop offset="55%" style="stop-color:rgba(103, 232, 249, 0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0f14;stop-opacity:1" />
    </radialGradient>
    
    <!-- Glassmorphism filter -->
    <filter id="glass" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Cyan glow -->
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#67e8f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#0b0f14" rx="24"/>
  <rect width="600" height="300" fill="url(#bgGradient)" rx="24"/>
  
  <!-- Glassmorphic card background -->
  <rect x="30" y="30" width="540" height="240" rx="36" 
        fill="rgba(15, 23, 42, 0.6)" 
        filter="url(#glass)"
        stroke="rgba(103, 232, 249, 0.3)" 
        stroke-width="2"/>
  
  <!-- Stables Logo Symbol (embedded from logo-symbol.png) -->
  <image href="logo-symbol.png" x="45" y="75" width="120" height="120" preserveAspectRatio="xMidYMid meet" filter="url(#cyanGlow)"/>
  
  <!-- "Pay in" text on top -->
  <text x="300" y="100" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" 
        fill="#9fb0c0" text-anchor="start">Pay in</text>
  
  <!-- "STABLES" name (matching presentation style) -->
  <text x="300" y="165" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="900" 
        fill="url(#textGradient)" text-anchor="start" letter-spacing="-0.02em">STABLES</text>
  
  <!-- "Here" text underneath -->
  <text x="300" y="210" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" 
        fill="#67e8f9" text-anchor="start">Here</text>
  
  <!-- "made possible by Minima" at bottom -->
  <text x="300" y="250" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" 
        fill="#9fb0c0" text-anchor="start" opacity="0.8">made possible by Minima</text>
  
  <!-- Cyan accent line -->
  <line x1="300" y1="115" x2="555" y2="115" stroke="#67e8f9" stroke-width="2" opacity="0.4"/>
</svg>
