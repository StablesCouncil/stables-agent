<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stables Facebook Banner</title>
    
    <!-- Google Fonts - Inter (matching the presentation) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0b0f14;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .banner {
            width: 820px;
            height: 312px;
            background: radial-gradient(circle at top, rgba(103, 232, 249, 0.18), transparent 55%) #0b0f14;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        /* Animated background glow */
        .banner::before {
            content: '';
            position: absolute;
            top: -40%;
            right: 5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(103, 232, 249, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .banner::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: 10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 6s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 440px;
        }

        .minima-badge {
            display: inline-block;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(103, 232, 249, 0.5);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #67e8f9;
            text-transform: uppercase;
            margin-bottom: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(103, 232, 249, 0.2);
            text-decoration: none;
        }

        .logo-wordmark {
            max-width: 180px;
            height: auto;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 24px;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .description {
            font-size: 13px;
            color: #9fb0c0;
            line-height: 1.6;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .check-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .check-list li {
            font-size: 12px;
            color: #9fb0c0;
            line-height: 1.5;
        }

        .check-list li strong {
            color: #e6edf3;
            font-weight: 600;
        }

        .visual {
            position: relative;
            z-index: 2;
            width: 300px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mockup-frame {
            width: 280px;
            height: 220px;
            background: linear-gradient(135deg, rgba(103, 232, 249, 0.12), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(103, 232, 249, 0.5);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(103, 232, 249, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .mockup-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #67e8f9, #a78bfa);
        }

        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .wallet-title {
            font-size: 10px;
            color: #9fb0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .wallet-status {
            width: 8px;
            height: 8px;
            background: #67e8f9;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(103, 232, 249, 0.8);
        }

        .wallet-balance {
            text-align: center;
            margin: 24px 0;
        }

        .transaction-item {
            background: rgba(255,255,255,0.03);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .transaction-label {
            font-size: 12px;
            color: #e6edf3;
            font-weight: 500;
        }

        .transaction-amount {
            font-size: 13px;
            font-weight: 700;
        }

        .amount-negative {
            color: #f87171;
        }

        .amount-positive {
            color: #34d399;
        }

        .badge-you {
            display: inline-block;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(103, 232, 249, 0.5);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #67e8f9;
            text-transform: uppercase;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(103, 232, 249, 0.2);
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="content">
            <a href="https://minima.global" target="_blank" class="minima-badge">Built on <strong>MINIMA</strong></a>
            <img src="https://stablescouncil.github.io/brand/assets/logo-wordmark.png" alt="Stables" class="logo-wordmark">
            <div class="tagline">Be your bank</div>
            <div class="description">
                Money that is truly yours. Secure, Pseudonymous and Unstoppable.
            </div>
            <ul class="check-list">
                <li><strong>100% Self-Custody:</strong> Only you have the keys.</li>
                <li><strong>Day-to-day ready:</strong> Fast, cheap, and simple.</li>
                <li><strong>Stables:</strong> Designed to hold its value.</li>
            </ul>
        </div>

        <div class="visual">
            <div class="mockup-frame">
                <div class="wallet-header">
                    <div class="badge-you">FOR YOU</div>
                    <div class="wallet-status"></div>
                </div>
                <div class="wallet-title" style="font-size: 18px; font-weight: 700; margin-bottom: 18px;">Wallet</div>
                <div class="transaction-item">
                    <span class="transaction-label">Coffee Shop</span>
                    <span class="transaction-amount amount-negative">- 6.98 sUSD</span>
                </div>
                <div class="transaction-item">
                    <span class="transaction-label">Salary</span>
                    <span class="transaction-amount amount-positive">+ 3,500 sUSD</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
