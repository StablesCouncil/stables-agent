<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stables Hardware Wallet - Device Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f14;
            background-image: radial-gradient(circle at top center, rgba(103, 232, 249, 0.18) 0%, transparent 55%);
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .device-container {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        /* Phone Device Frame */
        .device-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 19.5;
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            border-radius: 48px;
            padding: 12px;
            box-shadow:
                0 50px 100px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(103, 232, 249, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Screen */
        .device-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 38px;
            overflow: hidden;
            position: relative;
        }

        /* Hardware Wallet Image */
        .wallet-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Notch (optional) */
        .device-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 28px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        /* Side Button */
        .device-button {
            position: absolute;
            right: -3px;
            top: 25%;
            width: 4px;
            height: 60px;
            background: linear-gradient(90deg, #2a3442 0%, #1a2332 100%);
            border-radius: 2px 0 0 2px;
        }

        /* Glow Effect */
        .device-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle at center, rgba(103, 232, 249, 0.2) 0%, transparent 70%);
            border-radius: 60px;
            z-index: -1;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Info Card */
        .info-card {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(103, 232, 249, 0.3);
            border-radius: 16px;
            padding: 16px 24px;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .info-card h3 {
            font-size: 16px;
            font-weight: 700;
            color: #67e8f9;
            margin-bottom: 4px;
        }

        .info-card p {
            font-size: 13px;
            color: #9fb0c0;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .device-container {
                max-width: 450px;
            }
        }
    </style>
</head>

<body>
    <div class="device-container">
        <div class="device-glow"></div>
        <div class="device-frame">
            <div class="device-notch"></div>
            <div class="device-screen">
                <img src="hardware_wallet_vision_final.png" alt="Stables Hardware Wallet" class="wallet-image">
            </div>
            <div class="device-button"></div>
        </div>
        <div class="info-card">
            <h3>The Ultimate Vision</h3>
            <p>Dedicated Banking Device</p>
        </div>
    </div>
</body>

</html>
