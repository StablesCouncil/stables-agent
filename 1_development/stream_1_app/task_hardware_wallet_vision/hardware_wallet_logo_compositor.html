<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stables Hardware Wallet - Logo Compositor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f14;
            color: #e6edf3;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .controls {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(103, 232, 249, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            max-width: 600px;
            width: 100%;
        }

        .controls h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #67e8f9;
        }

        .controls p {
            font-size: 13px;
            color: #9fb0c0;
            margin-bottom: 16px;
        }

        button {
            background: linear-gradient(135deg, rgba(103, 232, 249, 0.3), rgba(167, 139, 250, 0.3));
            border: 1px solid rgba(103, 232, 249, 0.5);
            border-radius: 12px;
            padding: 14px 32px;
            color: #e6edf3;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 12px;
        }

        button:hover {
            background: linear-gradient(135deg, rgba(103, 232, 249, 0.5), rgba(167, 139, 250, 0.5));
            box-shadow: 0 0 30px rgba(103, 232, 249, 0.3);
            transform: translateY(-2px);
        }

        #canvas-container {
            position: relative;
            max-width: 600px;
            width: 100%;
        }

        #output-canvas {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(103, 232, 249, 0.15);
        }

        .note {
            background: rgba(103, 232, 249, 0.1);
            border: 1px solid rgba(103, 232, 249, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            max-width: 600px;
            width: 100%;
            font-size: 13px;
            line-height: 1.6;
            color: #9fb0c0;
        }

        .note strong {
            color: #67e8f9;
        }

        .status {
            text-align: center;
            padding: 12px;
            background: rgba(103, 232, 249, 0.1);
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #67e8f9;
        }
    </style>
</head>

<body>
    <div class="controls">
        <h2>🎨 Logo Compositor</h2>
        <p>Overlaying official master brand assets onto hardware wallet image</p>
        <div class="status" id="status">Loading assets...</div>
        <button onclick="downloadImage()" id="downloadBtn" disabled>⬇️ Download Final Image</button>
    </div>

    <div id="canvas-container">
        <canvas id="output-canvas" width="1080" height="1080"></canvas>
    </div>

    <div class="note">
        <strong>✅ Using Official Master Assets:</strong><br>
        • master_symbol.png (Stables "S" on device body)<br>
        • master_wordmark_transparent.png (STABLES on screen)<br>
        • Composited onto hardware wallet base image
    </div>

    <script>
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');

        // Load all assets
        const baseImage = new Image();
        baseImage.src = 'hardware_wallet_base.png';

        const masterSymbol = new Image();
        masterSymbol.src = 'master_symbol.png';

        const masterWordmark = new Image();
        masterWordmark.src = 'master_wordmark_transparent.png';

        let assetsLoaded = 0;
        const totalAssets = 3;

        function updateStatus() {
            statusEl.textContent = `Loading assets... (${assetsLoaded}/${totalAssets})`;
            if (assetsLoaded === totalAssets) {
                statusEl.textContent = '✅ Ready! Click download to save.';
                downloadBtn.disabled = false;
                composite();
            }
        }

        baseImage.onload = () => {
            assetsLoaded++;
            updateStatus();
        };

        masterSymbol.onload = () => {
            assetsLoaded++;
            updateStatus();
        };

        masterWordmark.onload = () => {
            assetsLoaded++;
            updateStatus();
        };

        baseImage.onerror = () => {
            statusEl.textContent = '❌ Error loading base image';
            statusEl.style.background = 'rgba(255, 100, 100, 0.2)';
        };

        masterSymbol.onerror = () => {
            statusEl.textContent = '❌ Error loading master_symbol.png';
            statusEl.style.background = 'rgba(255, 100, 100, 0.2)';
        };

        masterWordmark.onerror = () => {
            statusEl.textContent = '❌ Error loading master_wordmark_transparent.png';
            statusEl.style.background = 'rgba(255, 100, 100, 0.2)';
        };

        function composite() {
            // Draw base image
            ctx.drawImage(baseImage, 0, 0, 1080, 1080);

            // Overlay master wordmark on screen (top center of device screen)
            // Device screen is roughly at x:400-680, y:180-450
            const wordmarkWidth = 200;
            const wordmarkHeight = (masterWordmark.height / masterWordmark.width) * wordmarkWidth;
            const wordmarkX = 540 - wordmarkWidth / 2;
            const wordmarkY = 200;
            ctx.drawImage(masterWordmark, wordmarkX, wordmarkY, wordmarkWidth, wordmarkHeight);

            // Overlay master symbol on device body (bottom metallic part)
            // Device body is roughly at x:400-680, y:450-600
            const symbolSize = 60;
            const symbolX = 540 - symbolSize / 2;
            const symbolY = 520;
            ctx.drawImage(masterSymbol, symbolX, symbolY, symbolSize, symbolSize);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'stables_hardware_wallet_final_with_masters.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>

</html>
