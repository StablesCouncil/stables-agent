    <style>

    <div class="lockup-container">
        <img src="../2_current/assets/brand_masters/master_symbol.png" alt="Stables Symbol" class="symbol">
        <img src="../2_current/assets/brand_masters/master_wordmark_transparent.png" alt="Stables" class="wordmark">
    </div>
